<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StickerGen - Gerador de Adesivos para Impressão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .sticker-card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
        }
        .sticker-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .sticker-card.selected {
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
        }
        .sticker-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(59,130,246,0.9);
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
        }
        .sticker-card:hover .sticker-overlay { opacity: 1; }
        .print-sheet {
            background: white;
            box-shadow: 0 0 0 1px #ddd;
            margin: 20px auto;
        }
        @media print {
            body * { visibility: hidden; }
            .print-sheet, .print-sheet * { visibility: visible; }
            .print-sheet { 
                position: absolute;
                left: 0;
                top: 0;
                width: 210mm;
                height: 297mm;
                margin: 0;
                box-shadow: none;
            }
        }
        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3B82F6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                        <i class="fas fa-sticker-melt text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold bg-gradient-to-r from-gray-900 to-slate-700 bg-clip-text text-transparent">StickerGen</h1>
                        <p class="text-xs text-slate-500">Adesivos profissionais para impressão</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4 text-sm">
                    <span id="selectionCount" class="font-medium text-slate-700 hidden">0/20 selecionados</span>
                    <button id="printBtn" class="px-6 py-2.5 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-medium rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 hidden">
                        <i class="fas fa-file-export mr-2"></i>Criar Folha A4
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Input Section -->
        <div id="inputSection" class="bg-white/60 backdrop-blur-md rounded-3xl p-8 lg:p-12 shadow-2xl border border-white/50 mb-12">
            <div class="max-w-4xl mx-auto">
                <h2 class="text-3xl lg:text-4xl font-bold bg-gradient-to-r from-gray-900 via-slate-700 to-slate-900 bg-clip-text text-transparent mb-8 text-center">
                    Crie seus adesivos personalizados
                </h2>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- Text Input -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-3">Descrição do adesivo</label>
                        <textarea 
                            id="stickerText" 
                            rows="4" 
                            placeholder="Ex: 'Café é vida', 'Melhor mãe do mundo', 'Fazenda São João'... Seja criativo!"
                            class="w-full p-5 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-200 resize-vertical bg-white/50 backdrop-blur-sm"
                        ></textarea>
                    </div>

                    <!-- Image Upload -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-3">Imagem de referência (opcional)</label>
                        <div class="relative">
                            <input type="file" id="imageUpload" accept="image/*" class="hidden">
                            <label for="imageUpload" class="w-full p-5 border-2 border-dashed border-slate-200 rounded-2xl hover:border-blue-400 hover:bg-blue-50/50 cursor-pointer transition-all duration-200 bg-white/50 backdrop-blur-sm flex items-center justify-center h-32">
                                <div id="uploadArea" class="text-center">
                                    <i class="fas fa-cloud-upload-alt text-3xl text-slate-400 mb-2"></i>
                                    <div class="text-sm text-slate-600">Clique para enviar imagem</div>
                                </div>
                                <div id="uploadPreview" class="hidden absolute inset-0 bg-cover bg-center rounded-2xl" style="background-image: none;"></div>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8 pt-8 border-t border-slate-200">
                    <!-- Style Selector -->
                    <div>
                        <label class="block text-xs font-medium text-slate-700 uppercase tracking-wide mb-2">Estilo</label>
                        <select id="styleSelect" class="w-full p-3 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-white/50">
                            <option value="minimalista">Minimalista</option>
                            <option value="fofo">Fofo</option>
                            <option value="moderno">Moderno</option>
                            <option value="vintage">Vintage</option>
                            <option value="ilustrado">Ilustrado</option>
                        </select>
                    </div>

                    <!-- Shape Selector -->
                    <div>
                        <label class="block text-xs font-medium text-slate-700 uppercase tracking-wide mb-2">Formato</label>
                        <select id="shapeSelect" class="w-full p-3 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all bg-white/50">
                            <option value="redondo">Redondo</option>
                            <option value="quadrado">Quadrado</option>
                            <option value="recorte">Recorte livre</option>
                        </select>
                    </div>

                    <!-- Background Selector -->
                    <div class="md:col-span-2">
                        <label class="block text-xs font-medium text-slate-700 uppercase tracking-wide mb-2">Fundo</label>
                        <div class="flex space-x-3">
                            <label class="flex items-center space-x-2 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-blue-50/50 group transition-all flex-1 bg-white/50">
                                <input type="radio" name="background" value="transparente" class="sr-only">
                                <div class="w-4 h-4 border-2 border-slate-400 rounded-full group-hover:border-blue-500 transition-all"></div>
                                <span class="text-sm font-medium text-slate-700 group-hover:text-blue-600">Transparente</span>
                            </label>
                            <label class="flex items-center space-x-2 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-blue-50/50 group transition-all flex-1 bg-white/50">
                                <input type="radio" name="background" value="branco" class="sr-only" checked>
                                <div class="w-4 h-4 border-2 border-slate-400 rounded-full group-hover:border-blue-500 transition-all"></div>
                                <span class="text-sm font-medium text-slate-700 group-hover:text-blue-600">Branco</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="mt-10 pt-10 border-t border-slate-200">
                    <button 
                        id="generateBtn" 
                        class="w-full bg-gradient-to-r from-blue-500 via-blue-600 to-purple-600 text-white font-bold py-6 px-8 rounded-3xl text-xl shadow-2xl hover:shadow-3xl hover:-translate-y-2 transition-all duration-300 flex items-center justify-center space-x-4 group"
                    >
                        <span class="group-hover:hidden">🎨 Gerar 8 Adesivos</span>
                        <div class="hidden group-hover:flex items-center space-x-3">
                            <div class="loading-spinner"></div>
                            <span>Gerando...</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="hidden">
            <div class="text-center mb-12">
                <h3 class="text-2xl font-bold text-slate-900 mb-2">Selecione seus adesivos favoritos</h3>
                <p class="text-slate-600 max-w-md mx-auto">Clique nos adesivos para selecioná-los. Máximo de 20 por folha A4.</p>
            </div>

            <!-- Stickers Grid -->
            <div id="stickersGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mb-12"></div>

            <!-- Print Preview -->
            <div id="printPreview" class="hidden">
                <h4 class="text-xl font-bold text-slate-900 mb-6 text-center">Pré-visualização da folha A4</h4>
                <div id="printSheet" class="print-sheet mx-auto max-w-[210mm] aspect-[210/297]"></div>
            </div>
        </div>
    </main>

    <script>
        class StickerGenerator {
            constructor() {
                this.selectedStickers = [];
                this.stickers = [];
                this.init();
            }

            init() {
                this.bindEvents();
                this.generateDemoStickers();
            }

            bindEvents() {
                document.getElementById('generateBtn').addEventListener('click', () => this.generateStickers());
                document.getElementById('imageUpload').addEventListener('change', (e) => this.handleImageUpload(e));
                document.querySelectorAll('input[name="background"]').forEach(radio => {
                    radio.addEventListener('change', () => this.updateDemoStickers());
                });
            }

            generateDemoStickers() {
                const text = document.getElementById('stickerText').value || 'StickerGen';
                this.stickers = Array.from({length: 8}, (_, i) => ({
                    id: i,
                    prompt: `${text} sticker estilo ${['minimalista','fofo','moderno','vintage','ilustrado'][i%5]}, formato ${['redondo','quadrado','recorte'][i%3]}, alta qualidade impressão`,
                    image: this.generateStickerImage(i, text)
                }));
                this.updateDemoStickers();
            }

            generateStickerImage(index, text) {
                // Canvas gerado para simular stickers reais
                const canvas = document.createElement('canvas');
                canvas.width = 400;
                canvas.height = 400;
                const ctx = canvas.getContext('2d');
                
                // Fundo
                const isTransparent = document.querySelector('input[value="transparente"]').checked;
                if (!isTransparent) {
                    const gradient = ctx.createRadialGradient(200, 200, 0, 200, 200, 200);
                    gradient.addColorStop(0, '#ffffff');
                    gradient.addColorStop(1, '#f8fafc');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, 400, 400);
                }
                
                // Borda de corte
                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 8;
                ctx.shadowColor = 'rgba(0,0,0,0.1)';
                ctx.shadowBlur = 10;
                ctx.lineJoin = 'round';
                
                const shapes = ['circle', 'square', 'ellipse'];
                const shape = shapes[index % shapes.length];
                
                if (shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(200, 200, 180, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (shape === 'square') {
                    ctx.strokeRect(20, 20, 360, 360);
                } else {
                    ctx.beginPath();
                    ctx.ellipse(200, 200, 190, 170, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                // Texto principal
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 48px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 200, 190);
                
                // Detalhes decorativos por estilo
                const styles = ['minimalista', 'fofo', 'moderno', 'vintage', 'ilustrado'];
                const style = styles[index % 5];
                
                if (style === 'fofo') {
                    ctx.fillStyle = '#f472b6';
                    ctx.font = 'bold 24px Inter, sans-serif';
                    ctx.fillText('💖', 200, 240);
                } else if (style === 'moderno') {
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(100, 150);
                    ctx.lineTo(300, 250);
                    ctx.stroke();
                }
                
                return canvas.toDataURL('image/png');
            }

            async generateStickers() {
                const btn = document.getElementById('generateBtn');
                const originalText = btn.innerHTML;
                
                btn.disabled = true;
                btn.querySelector('.group-hover\\:flex').classList.remove('hidden');
                btn.querySelector('span').classList.add('hidden');
                
                // Simula API call (substitua pela sua API real)
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                const text = document.getElementById('stickerText').value || 'StickerGen';
                this.stickers = Array.from({length: 8}, (_, i) => ({
                    id: i,
                    prompt: `${text} sticker profissional para impressão`,
                    image: this.generateStickerImage(i, text)
                }));
                
                this.showResults();
                btn.disabled = false;
                btn.innerHTML = originalText;
            }

            showResults() {
                document.getElementById('inputSection').classList.add('hidden');
                document.getElementById('resultsSection').classList.remove('hidden');
                
                const grid = document.getElementById('stickersGrid');
                grid.innerHTML = this.stickers.map(sticker => `
                    <div class="sticker-card group cursor-pointer" onclick="stickerGen.toggleSelection(${sticker.id})">
                        <div class="sticker-overlay">
                            <i class="fas fa-check text-xs"></i>
                        </div>
                        <img src="${sticker.image}" class="w-full h-64 md:h-72 object-cover rounded-2xl shadow-lg" alt="Adesivo ${sticker.id + 1}">
                    </div>
                `).join('');
                
                this.updateSelectionUI();
            }

            toggleSelection(id) {
                const index = this.selectedStickers.indexOf(id);
                if (index > -1) {
                    this.selectedStickers.splice(index, 1);
                } else if (this.selectedStickers.length < 20) {
                    this.selectedStickers.push(id);
                }
                
                this.updateSelectionUI();
                this.updateDemoStickers();
            }

            updateSelectionUI() {
                const countEl = document.getElementById('selectionCount');
                const printBtn = document.getElementById('printBtn');
                
                countEl.textContent = `${this.selectedStickers.length}/20 selecionados`;
                countEl.classList.toggle('hidden', this.selectedStickers.length === 0);
                printBtn.classList.toggle('hidden', this.selectedStickers.length === 0);
                
                // Atualiza visual dos cards selecionados
                document.querySelectorAll('.sticker-card').forEach((card, i) => {
                    card.classList.toggle('selected', this.selectedStickers.includes(i));
                });
            }

            updateDemoStickers() {
                this.stickers.forEach(sticker => {
                    sticker.image = this.generateStickerImage(sticker.id, document.getElementById('stickerText').value || 'StickerGen');
                });
            }

            async createPrintSheet
